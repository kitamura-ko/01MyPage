<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キタコウ | Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2b3138;
    --card-bg: #fafaf9;
    --text-main: #1a1a1a;
    --text-sub: #6b6b6b;
    --border: #e5e5e3;
    --accent: #3d6c94;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "Noto Sans JP", "Poppins", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--text-main);
    padding: 24px;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(61, 108, 148, 0.18), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(61, 108, 148, 0.14), transparent 45%);
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 56px 40px 44px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    animation: fadeUp 0.7s ease both;
  }

  .avatar-wrap {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 0 auto 28px;
  }

  .avatar-ring {
    position: absolute;
    inset: -6px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    opacity: 0.35;
  }

  .avatar {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }

  .name {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    color: var(--text-sub);
  }

  .name-en {
    display: block;
    font-family: "Poppins", sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.28em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .divider {
    width: 36px;
    height: 2px;
    background: var(--accent);
    margin: 0 auto 22px;
    border-radius: 2px;
  }

  .bio {
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--text-sub);
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .footer-mark {
    margin-top: 34px;
    font-family: "Poppins", sans-serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #b5b5b3;
    text-transform: uppercase;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .card { padding: 44px 28px 36px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <img class="avatar" src="./画像/kitakou.jfif" alt="キタコウのプロフィール画像">
    </div>

    <span class="name-en">Kitakou</span>
    <h1 class="name">キタコウ</h1>
    <div class="divider"></div>

    <p class="bio">
      会社員<br>
      Claude Code を勉強中
    </p>

    <div class="footer-mark">Digital Profile Card</div>
  </div>

</body>
</html>
